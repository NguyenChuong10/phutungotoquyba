name: Q.BA Enterprise CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Platform (Next.js SSG)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Typecheck Backend Platform (Express & Prisma)
        run: |
          cd backend
          npm ci
          npx tsc --noEmit
