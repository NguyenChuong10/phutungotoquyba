version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: phutungotoquyba-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phutungotoquyba
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data